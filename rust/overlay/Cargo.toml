[package]
name = "deskwaifu-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
# pkg-config finds libEGL at build time; EGL is a hard requirement anyway.
khronos-egl = { version = "6", features = ["static"] }
# The sys backend is required for the raw `wl_display`/`wl_proxy` pointers that
# `libwayland-egl` needs.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }

[dev-dependencies]
gl = "0.14"
libc = "0.2"
tempfile = "3"
wayland-scanner = "0.31"
