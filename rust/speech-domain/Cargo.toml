[package]
name = "deskwaifu-speech-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
