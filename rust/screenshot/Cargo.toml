[package]
name = "deskwaifu-screenshot"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
