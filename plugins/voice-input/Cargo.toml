[package]
name = "deskwaifu-voice-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
deskwaifu-sdk.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hickory-resolver = "0.25.2"
libc = "0.2"
once_cell = "1"
# 保留内置公共根证书，并信任系统管理员安装的私有 CA。
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = "0.13.2"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
