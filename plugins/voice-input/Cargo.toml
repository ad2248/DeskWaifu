[package]
name = "deskwaifu-voice-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
deskwaifu-sdk.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hickory-resolver = "0.25.2"
libc = "0.2"
once_cell = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util"] }

[lints]
workspace = true
