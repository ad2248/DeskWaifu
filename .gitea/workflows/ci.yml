name: DeskWaifu CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Arch build and headless Wayland test
    # This label must map to the digest-pinned deskwaifu-ci image.
    # Rebuild and publish it with scripts/rebuild-ci-image.sh.
    runs-on: deskwaifu-arch
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Verify runner isolation
        run: test ! -S /var/run/docker.sock

      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4

      - name: Verify renamed identifiers
        run: |
          legacy_name=waifu""land
          ! grep -RIn "$legacy_name" . \
            --exclude=README.md \
            --exclude-dir=.git \
            --exclude-dir=build-ci

      - name: Attach private build dependencies
        run: |
          deps_dir=$(bash scripts/find-deps-dir.sh) || {
            echo "::error::Unable to locate private build dependencies" >&2
            exit 1
          }
          {
            echo "DESKWAIFU_DEPS_DIR<<EOF"
            echo "$deps_dir"
            echo "EOF"
          } >> "$GITHUB_ENV"
          ln -s "$deps_dir/CubismSdkForNative-5-r.5" CubismSdkForNative-5-r.5
          ln -s "$deps_dir/glew" thirdParty/glew

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DDESKWAIFU_BUILD_CONTROL=ON

      - name: Build
        run: cmake --build build-ci

      - name: Test Qt IPC client
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error

      - name: Test headless Wayland and IPC
        run: bash scripts/headless-smoke-test.sh build-ci

      - name: Print logs after failure
        if: failure()
        run: |
          test ! -f build-ci/test-logs/sway.log || cat build-ci/test-logs/sway.log
          test ! -f build-ci/test-logs/deskwaifu.log || cat build-ci/test-logs/deskwaifu.log
          test ! -f build-ci/test-logs/deskwaifu-control.log || cat build-ci/test-logs/deskwaifu-control.log
