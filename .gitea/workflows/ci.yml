name: DeskWaifu Rust CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust checks and Arch package
    # Fixed image ID in runner config, force_pull=false; see rebuild-ci-image.sh.
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation and toolchain
        run: |
          test ! -S /var/run/docker.sock
          rustc --version
          cargo --version
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Configure bundled Cargo dependencies
        run: |
          test -r /opt/deskwaifu-cargo/config.toml || {
            echo 'CI image is missing Cargo dependencies. Rebuild the runner image for this Cargo.lock.' >&2
            exit 1
          }
          install -Dm644 /opt/deskwaifu-cargo/config.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - name: Build workspace (debug)
        run: bash scripts/ci-sccache.sh /cache/sccache-rust-test cargo build --workspace --frozen
      - name: Lint
        run: cargo clippy --workspace --all-targets --frozen -- -D warnings
      - name: Test
        run: |
          bash scripts/ci-sccache.sh /cache/sccache-rust-test \
            env -u DISPLAY -u WAYLAND_DISPLAY -u CUBISM_TEST_PCI -u CUBISM_TEST_SECOND_PCI \
            LIBGL_ALWAYS_SOFTWARE=1 cargo test --workspace --frozen
      - name: Build workspace (release)
        run: bash scripts/ci-sccache.sh /cache/sccache-rust-test cargo build --workspace --frozen --release
      - name: Test release tooling
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test plugin deployment tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test review tooling
        run: python3 -B -m unittest discover -s .gitea/scripts -p 'test_*.py' -v

  package:
    name: Rust Arch package
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation
        run: test ! -S /var/run/docker.sock
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Arch package
        env:
          DESKWAIFU_CI_SCCACHE: '1'
          DESKWAIFU_CI_OFFLINE: '1'
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_TAG="0.0.0.r$RELEASE_COMMIT"
          bash scripts/release-build.sh
      - name: Install package and check artifacts and CLI
        run: |
          pacman -U --noconfirm release-assets/deskwaifu-bin-*.pkg.tar.zst
          test "$(readlink -f /usr/bin/deskwaifu)" = /usr/lib/deskwaifu/deskwaifu
          test -x /usr/bin/deskwaifu-terminal-panel
          test -f /usr/lib/deskwaifu/plugins/libdeskwaifu_test_plugin.so
          test -f /usr/lib/deskwaifu/plugins/libdeskwaifu_voice_input.so
          test -f /usr/lib/deskwaifu/plugins/libdeskwaifu_terminal.so
          /usr/bin/deskwaifucli --help
          test ! -e /tmp/deskwaifu.socket
          /usr/bin/deskwaifu &
          host_pid=$!
          trap 'kill -TERM "$host_pid" 2>/dev/null || true; wait "$host_pid"' EXIT
          for attempt in {1..100}; do
            if test -S /tmp/deskwaifu.socket; then break; fi
            kill -0 "$host_pid"
            sleep 0.05
          done
          help_output=$(/usr/bin/deskwaifucli help)
          grep -E '^start_voice_input[[:space:]]' <<< "$help_output"
          grep -E '^terminal[[:space:]]' <<< "$help_output"
      - name: Clean package artifacts
        if: always()
        run: rm -rf release-assets

  gui:
    name: GUI integration and test records
    runs-on: deskwaifu-gui
    timeout-minutes: 25
    steps:
      - name: Verify runner isolation
        run: test ! -S /var/run/docker.sock
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build control panel
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_BUILD_JOBS: '3'
        run: |
          install -Dm644 /opt/deskwaifu-cargo/config.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          CARGO_TARGET_DIR="$PWD/target" cargo build --frozen -p deskwaifu-terminal-panel
      - name: Run and record GUI case
        id: gui_case
        run: python3 -B tests/gui_panel_open_close.py --bin-dir target/debug --output target/test-records
      - name: Archive test records
        id: archive
        if: ${{ always() && (steps.gui_case.outcome == 'success' || steps.gui_case.outcome == 'failure') }}
        run: tar --zstd -cf target/test-records.tzst -C target/test-records .
      - name: Upload test records
        if: ${{ always() && steps.archive.outcome == 'success' }}
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-records
          path: target/test-records.tzst
          if-no-files-found: error
          compression-level: 0

  report:
    name: Report CI failure to OpenHands
    needs: [package, test, gui]
    # 用 always() 而不是 failure()：漏报一次失败就没人在 PR 上修，
    # 代价高于多跑一个几秒的空作业。是否真的失败由下面的步骤自己判断。
    if: always()
    runs-on: deskwaifu-rust
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4

      - name: Report CI failure to OpenHands
        env:
          PIPELINE_WEBHOOK_SECRET: ${{ secrets.PIPELINE_WEBHOOK_SECRET }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GUI_RESULT: ${{ needs.gui.result }}
        run: |
          failed=()
          if [[ "$PACKAGE_RESULT" == "failure" ]]; then failed+=("package"); fi
          if [[ "$TEST_RESULT" == "failure" ]]; then failed+=("test"); fi
          if [[ "$GUI_RESULT" == "failure" ]]; then failed+=("gui"); fi
          if [[ ${#failed[@]} -eq 0 ]]; then
            echo "CI 未失败，跳过回调"
            exit 0
          fi
          CI_FAILED_JOBS="${failed[*]}" python3 -B .gitea/scripts/report-ci-failure.py
