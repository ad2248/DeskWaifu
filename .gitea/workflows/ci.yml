name: DeskWaifu Rust CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust checks and Arch package
    # Fixed image ID in runner config, force_pull=false; see rebuild-ci-image.sh.
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation and toolchain
        run: |
          test ! -S /var/run/docker.sock
          rustc --version
          cargo --version
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --frozen -- -D warnings
      - name: Test
        run: cargo test --workspace --frozen
      - name: Release build
        run: cargo build --workspace --release --frozen
      - name: Test release tooling
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test review tooling
        run: python3 -B -m unittest discover -s .gitea/scripts -p 'test_*.py' -v

  package:
    name: Rust Arch package
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation
        run: test ! -S /var/run/docker.sock
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Arch package
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_TAG="0.0.0.r$RELEASE_COMMIT"
          bash scripts/release-build.sh
      - name: Install and run packaged host
        run: |
          pacman -U --noconfirm release-assets/deskwaifu-bin-*.pkg.tar.zst
          /usr/bin/deskwaifu
      - name: Clean package artifacts
        if: always()
        run: rm -rf release-assets

  report:
    name: Report CI failure to OpenHands
    # 两个作业可能同时失败。若各自上报，同一次 CI 失败会创建两个智能体运行
    # （见运行 722/710：一次失败产生两条 runs_created），此处集中上报一次。
    needs: [package, test]
    # 用 always() 而不是 failure()：漏报一次失败就没人在 PR 上修，
    # 代价高于多跑一个几秒的空作业。是否真的失败由下面的步骤自己判断。
    if: always()
    runs-on: deskwaifu-rust
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4

      - name: Report CI failure to OpenHands
        env:
          PIPELINE_WEBHOOK_SECRET: ${{ secrets.PIPELINE_WEBHOOK_SECRET }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          failed=()
          if [[ "$PACKAGE_RESULT" == "failure" ]]; then failed+=("package"); fi
          if [[ "$TEST_RESULT" == "failure" ]]; then failed+=("test"); fi
          if [[ ${#failed[@]} -eq 0 ]]; then
            echo "CI 未失败，跳过回调"
            exit 0
          fi
          CI_FAILED_JOBS="${failed[*]}" python3 -B .gitea/scripts/report-ci-failure.py
