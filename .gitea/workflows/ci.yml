name: DeskWaifu Rust CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust checks and Arch package
    # Fixed image ID in runner config, force_pull=false; see rebuild-ci-image.sh.
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation and toolchain
        run: |
          test ! -S /var/run/docker.sock
          rustc --version
          cargo --version
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Configure bundled Cargo dependencies
        run: |
          test -r /opt/deskwaifu-cargo/config.toml || {
            echo 'CI image is missing Cargo dependencies. Rebuild the runner image for this Cargo.lock.' >&2
            exit 1
          }
          install -Dm644 /opt/deskwaifu-cargo/config.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - name: Build host and stage plugins
        run: bash scripts/ci-sccache.sh /cache/sccache-rust-test env CARGO_NET_OFFLINE=true bash scripts/build.sh
      - name: Lint
        run: cargo clippy --workspace --all-targets --frozen -- -D warnings
      - name: Test
        run: bash scripts/ci-sccache.sh /cache/sccache-rust-test cargo test --workspace --frozen
      - name: Release build
        run: bash scripts/ci-sccache.sh /cache/sccache-rust-test env CARGO_NET_OFFLINE=true bash scripts/build.sh --release
      - name: Test release tooling
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test plugin deployment tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test review tooling
        run: python3 -B -m unittest discover -s .gitea/scripts -p 'test_*.py' -v

  package:
    name: Rust Arch package
    runs-on: deskwaifu-rust
    timeout-minutes: 30
    steps:
      - name: Verify runner isolation
        run: test ! -S /var/run/docker.sock
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Arch package
        env:
          DESKWAIFU_CI_SCCACHE: '1'
          DESKWAIFU_CI_OFFLINE: '1'
        run: |
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_TAG="0.0.0.r$RELEASE_COMMIT"
          bash scripts/release-build.sh
      - name: Install package and check CLI
        run: |
          pacman -U --noconfirm release-assets/deskwaifu-bin-*.pkg.tar.zst
          test "$(readlink -f /usr/bin/deskwaifu)" = /usr/lib/deskwaifu/deskwaifu
          test -f /usr/lib/deskwaifu/plugins/libdeskwaifu_test_plugin.so
          test -f /usr/lib/deskwaifu/plugins/libdeskwaifu_voice_input.so
          /usr/bin/deskwaifucli --help
          test ! -e /tmp/deskwaifu.socket
          /usr/bin/deskwaifu &
          host_pid=$!
          trap 'kill -TERM "$host_pid" 2>/dev/null || true; wait "$host_pid"' EXIT
          for attempt in {1..100}; do
            if test -S /tmp/deskwaifu.socket; then break; fi
            kill -0 "$host_pid"
            sleep 0.05
          done
          /usr/bin/deskwaifucli help | grep -E '^start_voice_input[[:space:]]'
      - name: Clean package artifacts
        if: always()
        run: rm -rf release-assets

  report:
    name: Report CI failure to OpenHands
    # 两个作业可能同时失败。若各自上报，同一次 CI 失败会创建两个智能体运行
    # （见运行 722/710：一次失败产生两条 runs_created），此处集中上报一次。
    needs: [package, test]
    # 用 always() 而不是 failure()：漏报一次失败就没人在 PR 上修，
    # 代价高于多跑一个几秒的空作业。是否真的失败由下面的步骤自己判断。
    if: always()
    runs-on: deskwaifu-rust
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://git.kals.top/actions/checkout@v4

      - name: Report CI failure to OpenHands
        env:
          PIPELINE_WEBHOOK_SECRET: ${{ secrets.PIPELINE_WEBHOOK_SECRET }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          failed=()
          if [[ "$PACKAGE_RESULT" == "failure" ]]; then failed+=("package"); fi
          if [[ "$TEST_RESULT" == "failure" ]]; then failed+=("test"); fi
          if [[ ${#failed[@]} -eq 0 ]]; then
            echo "CI 未失败，跳过回调"
            exit 0
          fi
          CI_FAILED_JOBS="${failed[*]}" python3 -B .gitea/scripts/report-ci-failure.py
