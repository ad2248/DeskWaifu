[package]
name = "deskwaifu-os"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deskwaifu-runtime.workspace = true
deskwaifu-sdk.workspace = true
futures-core = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_44"] }

[dev-dependencies]
deskwaifu-test-plugin.workspace = true
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
